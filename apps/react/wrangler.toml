name = "filmdle"
pages_build_output_dir = "dist"
compatibility_date = "2024-12-30"

# Lives here (not at the repo root) so Cloudflare Pages CI stays in legacy
# build mode — it just uploads `pages_build_output_dir` instead of requiring
# a wrangler-managed `deploy` command (which would need a custom API token).
#
# TMDB bearer token is provided as a Pages secret:
#   pnpm wrangler pages secret put TMDB_BEARER --project-name filmdle
# For local `wrangler pages dev`, add it to apps/react/.dev.vars (gitignored).

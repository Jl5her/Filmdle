<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#2a1810" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/favicon.svg" />
    <title>Filmdle — Daily Movie Trivia</title>
    <meta
      name="description"
      content="A daily Wordle-style guessing game for film fans. Guess the actor or the movie in 5 tries."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Anton&family=Geist:wght@400;500;600;700;800;900&family=Inter:wght@500;600;700&family=Oswald:wght@300;400;500&family=Pacifico&display=swap"
    />
    <script>
      (() => {
        try {
          var stored = localStorage.getItem("stardle-theme")
          var preferDark = window.matchMedia("(prefers-color-scheme: dark)").matches
          var dark = stored === "dark" || (stored !== "light" && preferDark)
          if (dark) document.documentElement.classList.add("dark")
        } catch (_e) {}
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>

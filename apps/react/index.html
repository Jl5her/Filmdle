<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content" />
    <meta name="theme-color" content="#2a1810" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Filmdle" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black" />
    <title>Filmdle — Daily Movie Trivia</title>
    <meta
      name="description"
      content="Five daily film & actor guessing games: guess the actor, the movie, or the film from a terribly explained plot."
    />
    <!-- Link previews (iMessage, WhatsApp, Slack, social). %SITE_URL% is filled in at build time. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Filmdle" />
    <meta property="og:title" content="Filmdle — Daily Movie Trivia" />
    <meta
      property="og:description"
      content="Five daily film & actor guessing games. Can you name today's movie?"
    />
    <meta property="og:image" content="%SITE_URL%/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="A Filmdle admission ticket: Admit one, five daily film and actor games" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="%SITE_URL%/og-image.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Anton&family=Geist:wght@400;500;600;700;800;900&family=Oswald:wght@300;400;500;600;700&family=Pacifico&display=swap"
    />
    <script>
      (() => {
        try {
          var stored = localStorage.getItem("stardle-theme")
          var preferDark = window.matchMedia("(prefers-color-scheme: dark)").matches
          var dark = stored === "dark" || (stored !== "light" && preferDark)
          if (dark) document.documentElement.classList.add("dark")
          if (localStorage.getItem("stardle-colorblind") === "1") document.documentElement.dataset.colorblind = ""
          var design = localStorage.getItem("stardle-design")
          document.documentElement.dataset.design =
            design === "cinema" || design === "modern" ? design : "ticket"
        } catch (_e) {}
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>

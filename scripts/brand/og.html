<!doctype html><html lang="en"><head>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Geist:wght@400;600&display=swap" rel="stylesheet">
<style>
html,body{margin:0}
.bg{width:1200px;height:630px;background:radial-gradient(ellipse 70% 80% at 50% 40%,#5a3d1c 0%,#2e1f10 55%,#1a1108 100%);display:flex;align-items:center;justify-content:center}
.t{position:relative;width:1000px;height:470px;background:#faf3e0;display:flex;color:#2a1810;
  -webkit-mask: radial-gradient(circle 26px at 0 0,#0000 26px,#000 26.5px) top left/51% 51% no-repeat, radial-gradient(circle 26px at 100% 0,#0000 26px,#000 26.5px) top right/51% 51% no-repeat, radial-gradient(circle 26px at 0 100%,#0000 26px,#000 26.5px) bottom left/51% 51% no-repeat, radial-gradient(circle 26px at 100% 100%,#0000 26px,#000 26.5px) bottom right/51% 51% no-repeat}
.body{flex:1;margin:22px 0 22px 22px;border:5px double #d0786f;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px}
.admit{font:30px Anton,sans-serif;letter-spacing:.3em;color:#b9281e}
.title{font:150px/1 Anton,sans-serif;letter-spacing:.06em;color:#b9281e}
.sub{font:600 30px Geist,sans-serif;letter-spacing:.04em}
.games{font:400 20px Geist,sans-serif;letter-spacing:.12em;white-space:nowrap;text-transform:uppercase;color:#5c4524;margin-top:10px}
.perf{width:0;border-left:7px dotted #2e1f10;margin:30px 0}
.stub{width:190px;background:#f1e3bd;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px}
.vert{writing-mode:vertical-rl;transform:rotate(180deg);font:34px Anton,sans-serif;letter-spacing:.25em;color:#b9281e}
.bars{width:70px;height:120px;background:repeating-linear-gradient(to bottom,#2a1810 0 3px,transparent 3px 5px,#2a1810 5px 6px,transparent 6px 9px,#2a1810 9px 13px,transparent 13px 15px)}
</style></head><body><div class="bg"><div class="t">
<div class="body"><div class="admit">★ ADMIT ONE ★</div><div class="title">FILMDLE</div>
<div class="sub">Five daily film &amp; actor games</div><div class="games">Actordle · Filmdle · Creditdle · Showdle · Plotdle</div></div>
<div class="perf"></div><div class="stub"><div class="vert">NOW SHOWING</div><div class="bars"></div></div>
</div></div></body></html>
